
<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l5.3-5.3a5 5 0 0 0 6.4-6.4l-3.1 3.1-3-3 3.1-3.1Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="brand-text">
      <h2>Inventory<span>Desktop</span></h2>
      <p>GESTIÓN DE INVENTARIO</p>
    </div>
  </div>

  <div class="menu-section">
    <span class="section-title">GENERAL</span>

    <nav class="menu">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
      >
        <span class="menu-icon">▦</span>
        <span>Dashboard</span>
      </a>
    </nav>
  </div>

  <div class="menu-section">
    <span class="section-title">INVENTARIO</span>

    <nav class="menu">
      <a routerLink="/products" routerLinkActive="active" class="menu-item">
        <span class="menu-icon">▣</span>
        <span>Productos</span>
      </a>

      <a routerLink="/categories" routerLinkActive="active" class="menu-item">
        <span class="menu-icon">▤</span>
        <span>Categorías</span>
      </a>

      <a routerLink="/providers" routerLinkActive="active" class="menu-item">
        <span class="menu-icon">▥</span>
        <span>Proveedores</span>
      </a>

      <a
        routerLink="/inventory-movements"
        routerLinkActive="active"
        class="menu-item"
      >
        <span class="menu-icon">▧</span>
        <span>Movimientos</span>
      </a>
    </nav>
  </div>

  <div class="menu-section" *ngIf="isAdmin">
    <span class="section-title">ADMINISTRACIÓN</span>

    <nav class="menu">
      <a routerLink="/users" routerLinkActive="active" class="menu-item">
        <span class="menu-icon">♙</span>
        <span>Usuarios</span>
      </a>
    </nav>
  </div>

  <div class="sidebar-footer">
    <div class="footer-indicator"></div>
    <span>Sistema de inventario</span>
  </div>
</aside>
