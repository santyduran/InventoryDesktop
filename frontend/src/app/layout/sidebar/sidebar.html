
<aside class="sidebar">
  <div class="brand">
    <img
      class="brand-logo"
      [src]="brand.logo"
      [alt]="brandName"
      width="168"
      height="147"
    />
    <p>GESTIÓN DE INVENTARIO</p>
  </div>

  <div class="menu-section">
    <span class="section-title">GENERAL</span>

    <nav class="menu">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
      >
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1.5" />
          <rect x="14" y="3" width="7" height="5" rx="1.5" />
          <rect x="14" y="12" width="7" height="9" rx="1.5" />
          <rect x="3" y="16" width="7" height="5" rx="1.5" />
        </svg>
        <span>Dashboard</span>
      </a>
    </nav>
  </div>

  <div class="menu-section">
    <span class="section-title">INVENTARIO</span>

    <nav class="menu">
      <a routerLink="/products" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 8 12 3 3 8l9 5 9-5Z" />
          <path d="M3 8v8l9 5 9-5V8" />
          <path d="M12 13v8" />
          <path d="m7.5 5.5 9 5" />
        </svg>
        <span>Productos</span>
      </a>

      <a routerLink="/categories" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z" />
          <circle cx="7.5" cy="7.5" r="1.5" />
        </svg>
        <span>Categorías</span>
      </a>

      <a routerLink="/providers" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 6h12v11H2Z" />
          <path d="M14 10h4l4 4v3h-8" />
          <circle cx="6.5" cy="18" r="2" />
          <circle cx="17.5" cy="18" r="2" />
        </svg>
        <span>Proveedores</span>
      </a>

      <a
        routerLink="/inventory-movements"
        routerLinkActive="active"
        class="menu-item"
      >
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 20V4" />
          <path d="m3 8 4-4 4 4" />
          <path d="M17 4v16" />
          <path d="m13 16 4 4 4-4" />
        </svg>
        <span>Movimientos</span>
      </a>
    </nav>
  </div>

  <div class="menu-section" *ngIf="isAdmin">
    <span class="section-title">ADMINISTRACIÓN</span>

    <nav class="menu">
      <a routerLink="/users" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3.5" />
          <path d="M2.5 20a6.5 6.5 0 0 1 13 0" />
          <path d="M16 4.6a3.5 3.5 0 0 1 0 6.8" />
          <path d="M18.5 14.3A6.5 6.5 0 0 1 21.5 20" />
        </svg>
        <span>Usuarios</span>
      </a>

      <a routerLink="/backups" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <ellipse cx="12" cy="5.5" rx="7.5" ry="2.8" />
          <path d="M4.5 5.5v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.5" />
          <path d="M4.5 12v6.5c0 1.5 3.4 2.8 7.5 2.8 1 0 2-.1 2.9-.2" />
          <path d="M19 15.5v5M16.8 18.3l2.2 2.2 2.2-2.2" />
        </svg>
        <span>Respaldos</span>
      </a>
    </nav>
  </div>

  <div class="sidebar-footer">
    <div class="footer-indicator"></div>
    <span>Sistema de inventario</span>
  </div>
</aside>
