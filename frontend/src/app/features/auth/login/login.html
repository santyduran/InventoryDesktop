
<div class="login-page">
  <div class="login-background"></div>

  <main class="login-container">
    <section class="login-card">

      <div class="brand">
        <img
          class="brand-logo"
          src="logo-el-marino.svg"
          alt="El Marino · Taller de Motos"
          width="200"
          height="175"
        />
        <p>CONTROL DE INVENTARIO</p>
      </div>

      <div class="welcome">
        <span class="welcome-label">BIENVENIDO</span>
        <h2>Inicia sesión</h2>
        <p>Ingresa tus credenciales para acceder al sistema.</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <div class="form-group">
          <label for="username">Correo electrónico</label>

          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="m3 7 9 6 9-6"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <input
              id="username"
              type="email"
              name="username"
              [(ngModel)]="username"
              placeholder="nombre@correo.com"
              autocomplete="username"
              required
              email
              [disabled]="loading"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>

          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect
                x="4"
                y="10"
                width="16"
                height="11"
                rx="2"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="M8 10V7a4 4 0 0 1 8 0v3"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
              <circle cx="12" cy="15" r="1" fill="currentColor" />
            </svg>

            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
              [disabled]="loading"
            />

            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              {{ showPassword ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>

        <label class="remember-option">
          <input
            type="checkbox"
            name="rememberUser"
            [(ngModel)]="rememberUser"
            [disabled]="loading"
          />
          <span>Recordar mi correo en este equipo</span>
        </label>

        <div class="error-message" *ngIf="errorMessage">
          <span>!</span>
          {{ errorMessage }}
        </div>

        <div class="success-message" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <button
          class="login-button"
          type="submit"
          [disabled]="loading || loginForm.invalid"
        >
          <span *ngIf="!loading">Ingresar al sistema</span>
          <span *ngIf="loading">Verificando credenciales...</span>

          <svg
            *ngIf="!loading"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M5 12h14m-6-6 6 6-6 6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

      </form>

      <div class="security-note">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6l-7-3Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <path
            d="m9 12 2 2 4-4"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Acceso seguro para personal autorizado
      </div>

    </section>

    <footer>
      El Marino · Taller de Motos · Sistema de inventario
    </footer>
  </main>
</div>
